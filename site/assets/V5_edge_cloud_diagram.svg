<rect x="613" y="98" width="90" height="28" fill="#F5F3EE" stroke="#0B0B0B" stroke-width="3"/>
<rect x="621" y="116" width="90" height="28" fill="#F2A900" stroke="#0B0B0B" stroke-width="3"/>
<path d="M709 94 L721 106 M721 94 L709 106" fill="none" stroke="#0B0B0B" stroke-width="3"/>
<text x="655" y="186" font-size="24" font-weight="700" fill="#0B0B0B" text-anchor="middle">Queue when</text>
<text x="655" y="216" font-size="24" font-weight="700" fill="#0B0B0B" text-anchor="middle">offline</text>
