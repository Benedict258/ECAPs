    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="576" y="35.264875" transform="rotate(-0 576 35.264875)">Edge-cloud collaboration: local first, cloud as a partner</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="576" y="113.2977" transform="rotate(-0 576 113.2977)">Cloud partner</text>
   </g>
   <g id="text_3">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #555555" x="576" y="149.038875" transform="rotate(-0 576 149.038875)">optional, when online</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="82.08" y="551.704625" transform="rotate(-0 82.08 551.704625)">Local node: keeps working with no network</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(135.103406 408.024456)">Sensors</text>
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(123.625594 436.818675)">and users</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="501.912" y="378.065875" transform="rotate(-0 501.912 378.065875)">1  Local-first answer</text>
   </g>
   <g id="text_7">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(385.785281 430.988344)">The node senses, decides</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(414.358875 455.306625)">and acts on its own</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="918.216" y="376.616969" transform="rotate(-0 918.216 376.616969)">3  Queue when offline</text>
   </g>
   <g id="text_9">
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(810.934594 431.906625)">Events and actions wait</text>
    <text style="font-size: 18px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(846.747562 453.562875)">in a local queue</text>
   </g>
