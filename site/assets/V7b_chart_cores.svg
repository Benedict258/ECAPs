<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" role="img" aria-labelledby="t-V7b_chart_cores d-V7b_chart_cores" font-family="Inter, system-ui, sans-serif" >
<title id="t-V7b_chart_cores">More compute, same bandwidth: little gain</title>
<desc id="d-V7b_chart_cores">Bar chart on the same scale as the bandwidth chart. At 400 GB/s: 24 cores 54.6 and 32 cores 61.2 tokens per second. At 800 GB/s: 48 cores 74.9 and 64 cores 83.7 tokens per second.</desc>
<text x="20" y="30" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="start">tokens per second</text>
<g><title>24 cores: 54.6 tokens per second</title><rect x="50" y="161.7" width="80" height="158.3" fill="#0B0B0B"/><text x="90" y="151.7" font-size="28" font-weight="700" fill="#0B0B0B" text-anchor="middle">54.6</text><text x="90" y="352" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">24</text><text x="90" y="382" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">cores</text></g>
<g><title>32 cores: 61.2 tokens per second</title><rect x="150" y="142.5" width="80" height="177.5" fill="#0B0B0B"/><text x="190" y="132.5" font-size="28" font-weight="700" fill="#0B0B0B" text-anchor="middle">61.2</text><text x="190" y="352" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">32</text><text x="190" y="382" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">cores</text></g>
<g><title>48 cores: 74.9 tokens per second</title><rect x="330" y="102.8" width="80" height="217.2" fill="#0B0B0B"/><text x="370" y="92.8" font-size="28" font-weight="700" fill="#0B0B0B" text-anchor="middle">74.9</text><text x="370" y="352" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">48</text><text x="370" y="382" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">cores</text></g>
<g><title>64 cores: 83.7 tokens per second</title><rect x="430" y="77.3" width="80" height="242.7" fill="#0B0B0B"/><text x="470" y="67.3" font-size="28" font-weight="700" fill="#0B0B0B" text-anchor="middle">83.7</text><text x="470" y="352" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">64</text><text x="470" y="382" font-size="24" font-weight="500" fill="#4A4A45" text-anchor="middle">cores</text></g>
<path d="M8 320 H552" fill="none" stroke="#0B0B0B" stroke-width="3"/>
</svg>
