<title id="t-V8_runtime_stack">The ECAPs Node Runtime stack</title>
<desc id="d-V8_runtime_stack">Four layers in order from top to bottom: Device interface, Agent runtime, Model manager, llama.cpp backend. Below them, four side parts: Power-aware modes, Local memory, Management API, Node discovery.</desc>
