<text x="385" y="186" font-size="24" font-weight="700" fill="#0B0B0B" text-anchor="middle">Escalate when</text>
<text x="385" y="216" font-size="24" font-weight="700" fill="#0B0B0B" text-anchor="middle">needed</text>
<path d="M506 125 H534 M526 117 L534 125 L526 133" fill="none" stroke="#0B0B0B" stroke-width="3"/>
